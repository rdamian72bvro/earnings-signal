name: CI

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ./backend/EarningsSignal.sln --configfile ./NuGet.Config

      - name: Build
        run: dotnet build ./backend/EarningsSignal.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ./backend/EarningsSignal.sln --configuration Release --no-build

      - name: Verify backtest endpoint test
        run: dotnet test ./backend/EarningsSignal.Tests/EarningsSignal.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~RunBacktest_AndReadBacktestEndpoints_ReturnsData"

      - name: Audit NuGet vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          report_file="nuget-vulnerability-report.json"
          dotnet list ./backend/EarningsSignal.sln package --vulnerable --include-transitive --format json --output-version 1 > "$report_file"
          cat "$report_file"
          if jq -e '.. | objects | select(has("vulnerabilities")) | select((.vulnerabilities | type) == "array" and (.vulnerabilities | length > 0))' "$report_file" > /dev/null; then
            echo "NuGet vulnerabilities detected."
            exit 1
          fi
          echo "No NuGet vulnerabilities detected."

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend/earnings-signal-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/earnings-signal-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit npm vulnerabilities
        run: npm audit --audit-level=low
